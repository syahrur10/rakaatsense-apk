<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RakaatSense</title><meta name="description" content="AI prayer assistant: rakat counter, movement check, dhikr, qibla.">
<meta name="theme-color" content="#0E7C4A"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1DB86E"/><stop offset="1" stop-color="#0A6B40"/></linearGradient><radialGradient id="lgGl"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs></svg>
<div id="splash"><div class="sp"><span data-logo></span><b>Rakaat<span>Sense</span></b></div></div>
<div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
<section id="auth" aria-label="RakaatSense">
  <div class="au-top">
    <div class="deco" id="authDeco"></div>
    <label class="lang au-lang"><span data-ic="globe" data-s="18"></span><select id="authLang" aria-label="Language"></select></label>
    <span data-logo class="au-logo"></span>
    <h1>Rakaat<span>Sense</span></h1>
    <p data-i="au.tag"></p>
  </div>
  <div class="au-sheet"><div class="au-card">
    <div class="seg" role="tablist"><button type="button" id="tIn" class="on" role="tab" aria-selected="true" data-i="au.in"></button><button type="button" id="tUp" role="tab" aria-selected="false" data-i="au.up"></button></div>
    <div id="socBox"><div class="soc">
      <button type="button" class="sbtn" data-p="google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.83z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/></svg><span data-i="au.google"></span></button>
    </div>
    <div class="or"><span data-i="au.or"></span></div></div>
    <form id="auForm" novalidate>
      <label class="fld" id="fName" hidden><span data-i="au.name"></span><div class="box"><span data-ic="user" data-s="20"></span><input id="aName" type="text" autocomplete="name" data-ph="au.ph.name"></div></label>
      <label class="fld"><span data-i="au.email"></span><div class="box"><span data-ic="mail" data-s="20"></span><input id="aMail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" data-ph="au.ph.mail"></div></label>
      <label class="fld"><span data-i="au.pass"></span><div class="box"><span data-ic="lock" data-s="20"></span><input id="aPass" type="password" autocomplete="current-password" data-ph="au.ph.pass"><button type="button" class="eye" id="aEye" data-ia="au.show" data-ic="eye" data-s="20"></button></div></label>
      <button type="button" class="au-link" id="auForgot" data-i="au.forgot"></button>
      <p class="au-ok" id="auOk" role="status" hidden></p>
      <p class="au-err" id="auErr" role="alert" hidden></p>
      <button class="btn" id="auGo" type="submit" data-i="au.go.in"></button>
    </form>
    <button type="button" class="au-guest" id="auGuest" data-i="au.guest"></button>
    <small class="au-note" data-i="au.note"></small>
  </div></div>
</section>
<main class="app">

<section id="home" class="tab on">
  <div class="hello">
    <div class="who"><span data-logo></span><b class="brand">Rakaat<span>Sense</span></b></div>
    <div class="tools"><label class="lang"><span data-ic="globe" data-s="18"></span><select id="lang" aria-label="Language"></select></label>
      <button class="icon" id="bell" data-ia="bell" data-ic="bell" data-s="20"></button>
      <button class="icon" id="admBtn" data-go="adm" data-ia="adm.title" data-ic="shield" data-s="20" hidden></button>
      <button class="icon" id="logout" data-ia="au.out" data-ic="logout" data-s="20"></button></div>
  </div>
  <div class="greet"><h1 id="greet"></h1><p id="greet2"></p><small id="dates"></small></div>
  <div class="banner"><small data-i="ban.s"></small><h2 data-i="ban.h"></h2>
    <div class="ban-btns"><button class="pill dark" data-go="rk" data-i="ban.b1"></button><button class="pill glass" data-go="cam" data-i="ban.b2"></button></div>
    <div class="deco" id="deco"></div></div>
  <div class="feat">
    <button class="fcard" data-go="rk"><span class="fi" data-ic="calib" data-s="28"></span><span class="ft"><b data-i="f.rk.t"></b><small data-i="f.rk.d"></small></span><span class="fa" data-ic="arrow" data-s="20"></span></button>
    <button class="fcard cam" data-go="cam"><span class="fi" data-ic="scan" data-s="28"></span><span class="ft"><b data-i="f.cam.t"></b><small data-i="f.cam.d"></small></span><span class="fa" data-ic="arrow" data-s="20"></span></button>
    <button class="fcard rp" data-go="rp"><span class="fi" data-ic="chart" data-s="28"></span><span class="ft"><b data-i="f.rp.t"></b><small data-i="f.rp.d"></small></span><span class="fa" data-ic="arrow" data-s="20"></span></button>
    <button class="fcard guide" id="homeGuide"><span class="fi" data-ic="help" data-s="28"></span><span class="ft"><b data-i="f.gd.t"></b><small data-i="f.gd.d"></small></span><span class="fa" data-ic="arrow" data-s="20"></span></button>
  </div>
  <div class="steps"><div><i>1</i><span data-i="st.1"></span></div><div><i>2</i><span data-i="st.2"></span></div><div><i>3</i><span data-i="st.3"></span></div></div>
  <div class="menu two">
    <button data-go="qb"><span data-ic="compass" data-s="26"></span><em data-i="m.qb"></em></button><button data-go="dz"><span data-ic="beads" data-s="26"></span><em data-i="m.dz"></em></button>
  </div>
  <div class="card times"><button class="loc" id="loc" data-ia="tm.tap"><span data-ic="pin" data-s="16"></span><span id="locTxt" data-i="tm.load"></span></button><h3 data-i="tm.title"></h3><div class="next"><span id="nextName">—</span> <b id="nextTime">--:--</b> <small id="countdown"></small></div>
    <div class="tgrid" id="tgrid"></div>
    <div class="sum"><div><b id="hStreak">0</b><small data-i="s.streak"></small></div><div><b id="hCam">–</b><small data-i="s.cam"></small></div><div><b id="hDone">0/5</b><small data-i="s.pr"></small></div></div></div>
</section>

<section id="adm" class="tab">
  <div class="dz-head"><button class="icon flip" id="admBack" data-ia="dz.back" data-ic="back"></button><h2 class="ttl" id="admTitle" data-i="adm.title"></h2><button class="icon" id="admRefresh" data-ia="adm.refresh" data-ic="reset" data-s="20"></button></div>
  <div id="aMain">
  <div class="adm-stats"><div><b id="aTot">0</b><small data-i="adm.users"></small></div><div><b id="aAdm">0</b><small data-i="adm.admins"></small></div><div><b id="aNew">0</b><small data-i="adm.new7"></small></div></div>
  <button class="btn abtn" id="aAdd" type="button" data-i="adm.add"></button>
  <p class="au-ok" id="aInfo"></p>
  <input class="adm-search" id="aSearch" type="search" data-ph="adm.search" autocomplete="off">
  <div class="card" id="aList"></div>
  </div>
  <div id="aDetail" hidden></div>
</section>

<section id="rk" class="tab">
  <div class="rk-head"><h2 class="ttl" data-i="rk.title"></h2><button class="gd-btn" id="guideBtn"><span data-ic="help" data-s="18"></span><span data-i="gd.btn"></span></button></div>
  <span class="glbl" data-i="rk.g.pray"></span>
  <div class="pills wrap" id="pPills"></div>
  <span class="glbl" data-i="rk.g.more"></span>
  <div class="pills wrap" id="xPills"></div>
  <div id="kindBox"><span class="glbl" data-i="rk.g.kind"></span>
    <div class="seg" id="kinds" role="tablist"><button type="button" data-k="f" data-i="rk.k.f"></button><button type="button" data-k="q" data-i="rk.k.q"></button><button type="button" data-k="b" data-i="rk.k.b"></button></div>
    <small class="mute nob" id="nob" data-i="rk.sn.nob" hidden></small></div>
  <div class="stepper" id="stepBox" hidden><span id="stepTxt"></span><button type="button" id="snDn" data-ic="minus" data-s="20" data-ia="rk.sn.dn"></button><b id="snN">2</b><button type="button" id="snUp" data-ic="plus" data-s="20" data-ia="rk.sn.up"></button></div>
  <div class="cp-act" hidden><button type="button" class="pill" data-cp="edit" data-i="cp.edit"></button><button type="button" class="pill del" data-cp="del" data-i="cp.del"></button></div>
  <span class="glbl" data-i="rk.g.pocket"></span>
  <div class="pk" id="pockets">
    <button type="button" class="pk-c on" data-m="shirt"><span class="pk-art" data-art="shirt"></span><b data-i="rk.shirt"></b><small data-i="rk.shirt.d"></small></button>
    <button type="button" class="pk-c" data-m="pants"><span class="pk-art" data-art="pants"></span><b data-i="rk.pants"></b><small data-i="rk.pants.d"></small></button>
  </div>
  <b class="rk-sel" id="rkSel"></b>
  <div class="circle big" id="cBig"><small data-i="rk.ruku"></small><b id="ruku">0</b><span id="rukuT">/ 2</span></div>
  <div class="circle sm" id="cSm"><small data-i="rk.sujud"></small><b id="sujud">0</b><span id="sujudT">/ 4</span></div>
  <p class="status" id="phase" data-i="rk.intro"></p>
  <div class="meter"><i id="ang"></i></div><small class="mute"><span data-i="rk.tilt"></span> <span id="angTxt">0</span>° · <span data-i="rk.rakaat"></span> <b id="rakaat">0</b></small>
  <div class="row"><button class="btn ghost" id="minus" data-ic="minus" aria-label="−1"></button><button class="btn" id="cStart" data-i="rk.start"></button><button class="btn ghost" id="plus" aria-label="+1">+1</button></div>
  <p class="mute small" data-i="rk.hint"></p>
  <button class="btn ghost rp-link" data-go="rp" type="button" data-i="rp.open"></button>
</section>

<section id="dz" class="tab">
  <div class="dz-head"><button class="icon flip" id="back" data-ia="dz.back" data-ic="back" hidden></button><h2 class="ttl" id="dzTitle" data-i="dz.title"></h2><button class="icon" id="sumBtn" data-ic="chart" data-s="20"></button></div>
  <div id="dzMain">
    <div class="chips" id="chips"></div>
    <button class="pill gold" id="pack" data-i="dz.pack"></button>
    <div class="dz-top"><span><span data-i="dz.set"></span>: <b id="dSet">1</b></span><span><span data-i="dz.tgt"></span>: <b id="dTgt">33</b></span></div>
    <div class="arab" id="arab"></div><div class="tr" id="tr"></div><div class="timer" id="dTime">0:00:00</div>
    <div class="num" id="dNum">000</div>
    <button class="tap" id="tap" data-ia="dz.tap"><span data-ic="beads" data-s="72"></span></button>
    <div class="row3"><button class="icon" id="dReset" data-ia="dz.reset" data-ic="reset" data-s="20"></button><button class="icon" id="dUndo" data-ia="dz.undo" data-ic="minus" data-s="20"></button></div>
  </div>
  <div id="dzSum" hidden>
    <div class="card"><div class="pills sm" id="rng"><button class="pill on" data-r="day" data-i="dz.day"></button><button class="pill" data-r="week" data-i="dz.week"></button><button class="pill" data-r="month" data-i="dz.month"></button><button class="pill" data-r="year" data-i="dz.year"></button></div>
      <svg id="bars" viewBox="0 0 320 150"></svg>
      <div class="sum"><div><b id="sTot">0</b><small data-i="dz.total"></small></div><div><b id="sDay">0</b><small data-i="dz.today"></small></div></div></div>
    <div id="sList"></div>
  </div>
</section>

<section id="cam" class="tab">
  <div class="rk-head"><h2 class="ttl" data-i="cam.title"></h2><button class="gd-btn" id="camGuideBtn"><span data-ic="help" data-s="18"></span><span data-i="gd.btn"></span></button></div>
  <p class="mute small" data-i="cam.hint"></p>

  <div id="camSum" hidden>
    <div class="w-sum"><small data-i="w.s.title"></small><b class="w-lbl" id="wSumLbl"></b>
      <div class="w-big" id="wSumBig"></div><p class="w-msg" id="wSumMsg"></p><small id="wSumSj"></small>
      <ul class="w-log" id="wLog"></ul>
      <button class="btn" id="wMark" type="button" data-i="w.mark" hidden></button>
      <button class="btn ghost rp-link" data-go="rp" type="button" data-i="rp.open"></button></div>
  </div>

  <div id="camSetup">
    <span class="glbl" data-i="rk.g.pray"></span>
    <div class="pills wrap" id="cPills"></div>
    <div id="cKindBox"><span class="glbl" data-i="rk.g.kind"></span>
      <div class="seg" id="cKinds" role="tablist"><button type="button" data-k="f" data-i="rk.k.f"></button><button type="button" data-k="q" data-i="rk.k.q"></button><button type="button" data-k="b" data-i="rk.k.b"></button></div></div>
    <div class="stepper" id="cStepBox" hidden><span id="cStepTxt"></span><button type="button" id="cSnDn" data-ic="minus" data-s="20" data-ia="rk.sn.dn"></button><b id="cSnN">2</b><button type="button" id="cSnUp" data-ic="plus" data-s="20" data-ia="rk.sn.up"></button></div>
    <div class="cp-act" hidden><button type="button" class="pill" data-cp="edit" data-i="cp.edit"></button><button type="button" class="pill del" data-cp="del" data-i="cp.del"></button></div>
    <b class="rk-sel" id="cSel"></b>
    <span class="glbl" data-i="cam.g.alert"></span>
    <div class="seg" id="cNotif" role="tablist"><button type="button" data-n="vib" data-i="cam.n.vib"></button><button type="button" data-n="snd" data-i="cam.n.snd"></button><button type="button" data-n="off" data-i="cam.n.off"></button></div>
    <small class="mute" data-i="cam.n.hint"></small>
    <span class="glbl" data-i="cam.m.t"></span>
    <div class="seg" id="cMode" role="tablist"><button type="button" data-m="tegak" data-i="cam.m.tegak"></button><button type="button" data-m="datar" data-i="cam.m.datar"></button></div>
    <small class="mute" id="cModeHint"></small>
    <div class="cam-how"><span data-ic="scan" data-s="26"></span><div><b data-i="cam.how.t"></b><small data-i="cam.how.d"></small></div></div>
  </div>

  <div class="cambox p" id="camBox" hidden><video id="video" playsinline muted></video><canvas id="ov"></canvas><div id="posture" class="badge" data-i="cam.ready"></div>
    <div class="cam-chips"><span id="chHead" data-i="cam.c.head"></span><span id="chSh" data-i="cam.c.sh"></span><span id="chHip" data-i="cam.c.hip"></span></div></div>
  <div id="camPrev" class="cam-prev" hidden><p id="camMsg" class="status"></p><small class="mute" id="camCnt"></small></div>

  <button class="btn" id="camBtn" data-i="cam.start"></button>
  <button class="btn ghost" id="camCancel" type="button" data-i="cam.cancel" hidden></button>
  <p class="mute small" data-i="cam.note"></p>
</section>

<section id="rp" class="tab">
  <div class="dz-head"><button class="icon flip" data-go="home" data-ia="dz.back" data-ic="back"></button><h2 class="ttl" data-i="rp.title"></h2></div>
  <div class="card rp-card">
    <div class="pills sm" id="rpRng"><button class="pill" data-r="day" data-i="rp.r.day"></button><button class="pill on" data-r="week" data-i="rp.r.week"></button><button class="pill" data-r="month" data-i="rp.r.month"></button></div>
    <div class="sum" id="rpSum"></div>
  </div>
  <div id="rpList"></div>
  <div class="rp-tools" id="rpTools"><button class="btn ghost" id="rpCopy" type="button" data-i="rp.copy"></button><button class="btn ghost del" id="rpClear" type="button" data-i="rp.clear"></button></div>
  <p class="mute small" data-i="rp.note"></p>
</section>

<section id="qb" class="tab">
  <h2 class="ttl" data-i="qb.title"></h2>
  <svg id="compass" viewBox="0 -24 280 304" aria-hidden="true">
    <circle class="bezel" cx="140" cy="140" r="122"/><circle class="gring" cx="140" cy="140" r="114"/>
    <g id="dial"></g>
    <path class="ptr" d="M129 -22H151L140 -1Z"/>
    <circle class="hub" cx="140" cy="140" r="9"/><circle cx="140" cy="140" r="3.2" fill="#fff"/>
  </svg>
  <div class="qinfo">
    <div class="qi"><small data-i="qb.you"></small><b id="qYou">--°</b><em id="qYouN">—</em></div>
    <div class="qi k"><small data-i="qb.kib"></small><b id="qKib">--°</b><em id="qKibN">—</em></div>
  </div>
  <p class="status" id="qTxt" data-i="qb.intro"></p>
  <button class="btn" id="qBtn" data-i="qb.start"></button>
</section>
</main>

<div class="sheet" id="cpSheet" hidden>
  <form class="sheet-card" id="cpForm" novalidate role="dialog" aria-modal="true" aria-labelledby="cpTitle">
    <h3 id="cpTitle"></h3>
    <label class="fld plain"><span data-i="cp.name"></span><div class="box"><input id="cpName" type="text" maxlength="30" autocomplete="off" data-ph="cp.ph"></div></label>
    <label class="fld plain" id="cpRBox"><span data-i="cp.r"></span><div class="box"><input id="cpR" type="number" inputmode="numeric" min="1" max="20" value="2"></div></label>
    <p class="au-err" id="cpErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="cpCancel" data-i="cp.cancel"></button><button type="submit" class="btn" data-i="cp.save"></button></div>
  </form>
</div>
<div id="watch" hidden aria-hidden="true"><p id="wTxt"></p><b id="wBig"></b><small id="wHold"></small></div>
<nav class="nav" id="nav"><button data-go="home" class="on"><span data-ic="home"></span><span data-i="nav.home"></span></button><button data-go="rk"><span data-ic="calib"></span><span data-i="nav.rk"></span></button><button data-go="cam"><span data-ic="scan"></span><span data-i="nav.cam"></span></button><button data-go="qb"><span data-ic="compass"></span><span data-i="m.qb"></span></button><button data-go="dz"><span data-ic="beads"></span><span data-i="m.dz"></span></button></nav>
<script type="module" src="/src/main.js"></script>
</body></html>
